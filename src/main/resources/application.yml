# 프로젝트 루트의 .env 파일이 있으면 읽어서 아래 ${...} 값으로 사용한다. (없으면 기본값)
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: chzzk-vod
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:500}MB
      max-request-size: ${MAX_UPLOAD_MB:500}MB
  # 방송 메타데이터는 파일 기반 H2 DB에 영속 저장한다. (재시작해도 유지)
  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/vod
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:3000}
  servlet:
    context-parameters:
      # WebSocket 시그널링 메시지(SDP) 버퍼. 기본 8KB 는 SDP 하나보다 작을 수 있다.
      "[org.apache.tomcat.websocket.textBufferSize]": 65536
  # 휴대폰 브라우저는 HTTPS(보안 컨텍스트)에서만 카메라·마이크를 허용한다.
  # 같은 Wi-Fi의 휴대폰으로 송출하려면 README의 "HTTPS 인증서 만들기"를 따라 켜세요.
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  max-upload-mb: ${MAX_UPLOAD_MB:500}
  live:
    # 송출자 1명이 시청자마다 직접 영상을 보내는 구조(P2P)라서 동시 시청자 수를 제한한다.
    max-viewers: ${LIVE_MAX_VIEWERS:10}
    # 송출 화면 연결이 끊긴 뒤 이 시간 안에 다시 연결되지 않으면 방송을 자동 종료한다.
    publisher-grace-seconds: ${LIVE_PUBLISHER_GRACE_SECONDS:30}
  # 4단계 도네이션: 결제 서비스 테스트·샌드박스 모드 (실제 돈은 결제되지 않음)
  payment:
    # sandbox = 키 없이 쓰는 내장 테스트 PG (기본) / toss = 토스페이먼츠 테스트 모드 (테스트 키 필요)
    provider: ${PAYMENT_PROVIDER:sandbox}
    toss:
      api-url: ${TOSS_API_URL:https://api.tosspayments.com}
      client-key: "${TOSS_CLIENT_KEY:}"
      secret-key: "${TOSS_SECRET_KEY:}"
  donation:
    min-amount: ${DONATION_MIN_AMOUNT:1000}
    max-amount: ${DONATION_MAX_AMOUNT:500000}
  rtc:
    stun-urls: "${STUN_URLS:stun:stun.l.google.com:19302}"
    turn-url: "${TURN_URL:}"
    turn-username: "${TURN_USERNAME:}"
    turn-credential: "${TURN_CREDENTIAL:}"
