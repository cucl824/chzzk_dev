<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다시보기</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a class="logo" href="/">VOD</a>
    <div class="header-actions">
      <a class="btn live" href="/live-start.html">라이브 시작</a>
      <a class="btn" href="/upload.html">방송 등록</a>
    </div>
  </header>
  <main>
    <p id="status" class="muted">불러오는 중…</p>
    <section id="detail" hidden>
      <video id="player" class="player" controls playsinline preload="metadata"></video>
      <p id="playError" class="error" hidden>영상을 재생할 수 없습니다. 파일 형식이나 영상 URL을 확인하세요.</p>
      <h1 id="title" class="detail-title"></h1>
      <div id="meta" class="muted"></div>
      <div id="desc" class="detail-desc" hidden></div>

      <!-- 소유자에게만 보이는 관리 버튼. 실제 권한은 서버가 검사한다 (다른 사용자가 요청해도 403) -->
      <section id="ownerPanel" class="panel owner-panel" hidden>
        <div class="row">
          <span class="muted">내 방송</span>
          <button type="button" class="btn secondary" id="editBtn">수정</button>
          <button type="button" class="btn danger" id="deleteBtn">삭제</button>
        </div>
        <form id="editForm" hidden>
          <label>제목
            <input type="text" name="title" maxlength="100" required>
          </label>
          <label>설명
            <textarea name="description" maxlength="2000"></textarea>
          </label>
          <p id="editError" class="error" hidden></p>
          <div class="row">
            <button type="submit" class="btn">저장</button>
            <button type="button" class="btn secondary" id="editCancel">취소</button>
          </div>
        </form>
      </section>

      <section id="donations"></section>
      <section id="comments"></section>
    </section>
    <p><a class="btn secondary" href="/">← 목록으로</a></p>
  </main>
  <script src="/common.js"></script>
  <script>
    // 소유자 관리: 제목·설명 수정, 삭제
    async function setupOwnerPanel(b) {
      const user = await currentUser();
      if (!user || b.owner?.id !== user.id) return;
      const panel = document.getElementById('ownerPanel');
      const form = document.getElementById('editForm');
      const error = document.getElementById('editError');
      panel.hidden = false;

      document.getElementById('editBtn').addEventListener('click', () => {
        form.title.value = b.title;
        form.description.value = b.description;
        form.hidden = false;
      });
      document.getElementById('editCancel').addEventListener('click', () => { form.hidden = true; });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.hidden = true;
        try {
          await api(`/api/broadcasts/${encodeURIComponent(b.id)}`,
            jsonRequest('PATCH', { title: form.title.value, description: form.description.value }));
          location.reload();
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
        }
      });
      document.getElementById('deleteBtn').addEventListener('click', async () => {
        if (!confirm('이 방송을 삭제할까요? 영상 파일과 댓글도 함께 삭제됩니다.')) return;
        try {
          await api(`/api/broadcasts/${encodeURIComponent(b.id)}`, { method: 'DELETE' });
          location.href = '/';
        } catch (err) {
          alert(err.message);
        }
      });
    }

    (async () => {
      const status = document.getElementById('status');
      const id = new URLSearchParams(location.search).get('id');
      try {
        if (!id) throw new Error('잘못된 주소입니다.');
        const { broadcast: b } = await api(`/api/broadcasts/${encodeURIComponent(id)}`);
        document.title = `${b.title} - 다시보기`;
        document.getElementById('title').textContent = b.title;

        const ytId = youtubeId(b.videoUrl);
        const meta = document.getElementById('meta');
        const renderMeta = (views) => {
          const source = b.sourceType === 'upload' ? `업로드 파일 ${formatSize(b.size)}`
            : ytId ? '유튜브 영상 연결' : '외부 영상 연결';
          const owner = b.owner ? `등록 ${b.owner.nickname}` : '등록자 없음(이전 단계 데이터)';
          meta.textContent = [owner, `조회수 ${views}`, formatDate(b.createdAt), source].join(' · ');
        };
        renderMeta(b.viewCount);

        if (b.description) {
          const desc = document.getElementById('desc');
          desc.textContent = b.description;
          desc.hidden = false;
        }

        const countView = async () => {
          try {
            const { viewCount } = await api(`/api/broadcasts/${encodeURIComponent(b.id)}/views`, { method: 'POST' });
            renderMeta(viewCount);
          } catch { /* 조회수 실패는 재생에 영향 주지 않음 */ }
        };

        const player = document.getElementById('player');
        if (ytId) {
          // 유튜브 임베드 플레이어. 재생 이벤트를 받을 수 없으므로 상세 화면을 열 때 조회수를 올린다.
          // 유튜브는 Referer가 없으면 재생을 막으므로 referrerPolicy를 명시한다.
          const start = youtubeStart(b.videoUrl);
          const frame = el('iframe', {
            class: 'player',
            src: `https://www.youtube.com/embed/${ytId}${start ? `?start=${start}` : ''}`,
            title: b.title,
            allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share',
            allowFullscreen: true,
            referrerPolicy: 'strict-origin-when-cross-origin',
          });
          player.replaceWith(frame);
          countView();
        } else {
          player.src = b.videoUrl;
          player.addEventListener('error', () => { document.getElementById('playError').hidden = false; });
          // 처음 재생할 때 한 번만 조회수를 올린다.
          player.addEventListener('play', countView, { once: true });
        }

        status.hidden = true;
        document.getElementById('detail').hidden = false;
        setupOwnerPanel(b);
        mountDonations(document.getElementById('donations'), 'broadcast', b.id, b.owner);
        mountComments(document.getElementById('comments'), `/api/broadcasts/${encodeURIComponent(b.id)}`);
      } catch (err) {
        status.textContent = err.message;
        status.className = 'error';
      }
    })();
  </script>
</body>
</html>
