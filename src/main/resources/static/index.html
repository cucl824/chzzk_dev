<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방송 목록</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a class="logo" href="/">VOD</a>
    <div class="header-actions">
      <a class="btn live" href="/live-start.html">라이브 시작</a>
      <a class="btn" href="/upload.html">방송 등록</a>
    </div>
  </header>
  <main>
    <h2 class="section-title">지금 라이브</h2>
    <div id="liveList" class="grid"></div>

    <h2 class="section-title">다시보기</h2>
    <p id="status" class="muted">불러오는 중…</p>
    <div id="list" class="grid"></div>

    <section id="endedSection" hidden>
      <h2 class="section-title">종료된 라이브</h2>
      <div id="endedList" class="grid"></div>
    </section>
  </main>
  <script src="/common.js"></script>
  <script>
    function liveCard(live) {
      const on = live.status === 'live';
      const meta = on
        ? `시청자 ${live.viewerCount}명 · ${formatElapsed(live.startedAt)} 방송 중`
        : `${formatDate(live.startedAt)} · ${formatElapsed(live.startedAt, live.endedAt)} 방송${live.vodBroadcastId ? ' · 다시보기 있음' : ''}`;
      return el('a', { class: 'card', href: `/live.html?id=${encodeURIComponent(live.id)}` },
        el('div', { class: 'thumb' },
          el('div', { class: `live-thumb${on ? ' on' : ''}` }, on ? '휴대폰 라이브' : '방송 종료'),
          statusBadge(live.status),
        ),
        el('div', { class: 'card-title', title: live.title }, live.title),
        el('div', { class: 'card-meta' }, meta),
      );
    }

    // 라이브 목록은 상태가 바뀌므로 주기적으로 다시 불러온다.
    async function loadLives() {
      const liveList = document.getElementById('liveList');
      const endedList = document.getElementById('endedList');
      try {
        const { lives } = await api('/api/lives');
        const onAir = lives.filter((l) => l.status === 'live');
        const ended = lives.filter((l) => l.status === 'ended').slice(0, 12);
        liveList.replaceChildren(...(onAir.length
          ? onAir.map(liveCard)
          : [el('div', { class: 'empty' }, '지금 방송 중인 라이브가 없습니다. 휴대폰으로 라이브를 시작해 보세요.')]));
        endedList.replaceChildren(...ended.map(liveCard));
        document.getElementById('endedSection').hidden = !ended.length;
      } catch (err) {
        liveList.replaceChildren(el('p', { class: 'error' }, err.message));
      }
    }

    async function loadVods() {
      const status = document.getElementById('status');
      const list = document.getElementById('list');
      try {
        const { broadcasts } = await api('/api/broadcasts');
        status.hidden = true;
        if (!broadcasts.length) {
          list.replaceWith(el('div', { class: 'empty' }, '등록된 방송이 없습니다. 첫 방송을 등록해 보세요.'));
          return;
        }
        for (const b of broadcasts) {
          // 유튜브는 제공 썸네일을, 그 외에는 영상의 1초 지점 프레임을 미리보기로 사용한다.
          const ytId = youtubeId(b.videoUrl);
          const preview = ytId
            ? el('img', { src: `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg`, alt: '' })
            : el('video', { src: `${b.videoUrl}#t=1`, preload: 'metadata', muted: true });
          list.append(
            el('a', { class: 'card', href: `/watch.html?id=${encodeURIComponent(b.id)}` },
              el('div', { class: 'thumb' }, preview, el('span', { class: 'badge' }, '다시보기')),
              el('div', { class: 'card-title', title: b.title }, b.title),
              el('div', { class: 'card-meta' }, `조회수 ${b.viewCount} · ${formatDate(b.createdAt)}`),
            ),
          );
        }
      } catch (err) {
        status.textContent = err.message;
        status.className = 'error';
      }
    }

    loadLives();
    loadVods();
    setInterval(loadLives, 5000);
  </script>
</body>
</html>
